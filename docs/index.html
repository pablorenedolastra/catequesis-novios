<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<title>De la mano para Novios</title>

<style>
/* Layout: columna de móvil (max 520px) con barra de pestañas fija abajo. Catequesis: carrusel de tarjetas azul marino, una por sesión. Programa: minicalendario, sesiones, temario y realizadas. */
:root {
  --bg: #f3eee5;
  --surface: #fbf8f2;
  --surface-2: #ebe3d4;
  --ink: #1a2740;
  --muted: #5e6879;
  --line: #e1d8c8;
  --navy: #1f3a64;
  --blue: #3f679e;
  --blue-soft: #dce7f3;
  --blue-ink: #1f3a64;
  --hero-bg: #1f3a64;
  --hero-ink: #f6f1e8;
  --hero-muted: #b9c8de;
  --chip-sand: #eadfca;
  --chip-sand-ink: #6b5634;
  --shadow: 0 1px 2px rgba(31,58,100,.06), 0 8px 24px rgba(31,58,100,.08);
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1626; --surface: #172138; --surface-2: #1f2b45; --ink: #f0e9dd; --muted: #a3acbd; --line: #28344f;
    --navy: #9dbbe3; --blue: #8fb1df; --blue-soft: #22365a; --blue-ink: #d3e2f6;
    --hero-bg: #24406b; --hero-ink: #f6f1e8; --hero-muted: #b9c8de;
    --chip-sand: #33302a; --chip-sand-ink: #e2d2b2; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1626; --surface: #172138; --surface-2: #1f2b45; --ink: #f0e9dd; --muted: #a3acbd; --line: #28344f;
  --navy: #9dbbe3; --blue: #8fb1df; --blue-soft: #22365a; --blue-ink: #d3e2f6;
  --hero-bg: #24406b; --hero-ink: #f6f1e8; --hero-muted: #b9c8de;
  --chip-sand: #33302a; --chip-sand-ink: #e2d2b2; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

.app {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
.view { display: grid; gap: 22px; min-width: 0; }
.view > * { min-width: 0; }

/* Cabecera */
.masthead { display: grid; gap: 6px; padding-top: 8px; }
.masthead .parish { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); }
.masthead h1 { margin: 0; font-size: 28px; line-height: 1.12; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.masthead h1 span { color: var(--blue); }
.masthead .course { font-size: 14px; color: var(--muted); font-weight: 500; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 999px; border: 0; cursor: pointer; text-decoration: none;
}
.pill svg { width: 14px; height: 14px; }
.pill.sand { background: var(--chip-sand); color: var(--chip-sand-ink); }
.pill.blue { background: var(--blue-soft); color: var(--blue-ink); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

/* Carrusel de sesiones */
.section-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.track {
  display: grid; grid-auto-flow: column; grid-auto-columns: 100%; gap: 12px;
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain; border-radius: 24px;
}
.track::-webkit-scrollbar { display: none; }
.hero {
  scroll-snap-align: start; scroll-snap-stop: always;
  display: grid; gap: 18px; align-content: start; width: 100%; text-align: left; cursor: pointer;
  background: var(--hero-bg); color: var(--hero-ink); border: 0; border-radius: 24px;
  padding: 22px 20px 20px; position: relative; overflow: hidden;
}
.hero.later { background: color-mix(in srgb, var(--hero-bg) 88%, #3f679e); }
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(220,231,243,.18), rgba(220,231,243,0) 70%); pointer-events: none;
}
.hero .tags { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .tag { font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 5px 10px; border-radius: 999px; background: rgba(246,241,232,.14); color: var(--hero-ink); }
.hero .tag.first { background: var(--hero-ink); color: var(--hero-bg); }
.hero .weekday { display: block; font-size: 15px; font-weight: 600; color: var(--hero-muted); }
.hero .date { display: block; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -.03em; }
.hero .facts { display: grid; gap: 10px; border-top: 1px solid rgba(246,241,232,.16); padding-top: 16px; }
.fact { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; }
.fact svg { width: 18px; height: 18px; margin-top: 2px; }
.hero .fact svg { color: var(--hero-muted); }
.fact strong { display: block; font-weight: 700; }
.fact small { display: block; color: var(--hero-muted); font-size: 13px; }
.hero .more { font-size: 13px; font-weight: 600; color: var(--hero-muted); display: inline-flex; align-items: center; gap: 4px; }
.hero .more svg { width: 14px; height: 14px; }

.car-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; margin-top: 12px; }
.arrow {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--blue-ink);
}
.arrow svg { width: 20px; height: 20px; }
.arrow:disabled { opacity: .35; cursor: default; }
.dots { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: var(--line); cursor: pointer; transition: width .2s, background .2s; }
.dot[aria-current="true"] { width: 22px; border-radius: 4px; background: var(--navy); }
.car-pos { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 6px; }

/* Programa */
.page-head h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }

/* Minicalendario */
.mc-head { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; }
.mc-head h3 { margin: 0; text-align: center; font-size: 16px; font-weight: 800; }
.mc-head .arrow { width: 40px; height: 40px; }
.mc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-variant-numeric: tabular-nums; }
.mc-grid .wd { font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 0 4px; }
.mc-grid .wd.thu { color: var(--blue); }
.mc-grid .d { aspect-ratio: 1; display: grid; place-items: center; font-size: 13px; border-radius: 50%; color: var(--ink); border: 0; background: transparent; padding: 0; min-width: 0; }
.mc-grid .d.thu { background: var(--surface-2); }
.mc-grid .d.today { box-shadow: inset 0 0 0 2px var(--blue); }
.mc-grid button.d.on { background: var(--navy); color: var(--surface); font-weight: 800; cursor: pointer; }
.mc-list { display: grid; gap: 8px; margin: 0; padding: 12px 0 0; list-style: none; border-top: 1px solid var(--line); }
.mc-list li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; font-size: 13px; align-items: baseline; }
.mc-list b { font-weight: 800; }
.mc-list span { color: var(--muted); }
.mc-list em { font-style: normal; font-weight: 700; color: var(--blue-ink); background: var(--blue-soft); padding: 1px 7px; border-radius: 6px; }
.mc-empty { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.theme { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; padding: 10px; border-radius: 14px; background: var(--surface-2); min-width: 0; }
.theme .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.theme.done .n { background: var(--navy); color: var(--surface); border-color: var(--navy); }
.theme.planned .n { background: var(--blue-soft); color: var(--blue-ink); border-color: transparent; }
.theme div { min-width: 0; }
.theme strong { display: block; font-size: 13px; line-height: 1.25; font-weight: 700; }
.theme small { display: block; font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.plan { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: 56px 1fr; gap: 14px; }
.card.done { background: transparent; }
.card .body { min-width: 0; display: grid; gap: 8px; }
.card .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }
.card h3 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.card .sub { margin: 0; font-size: 13px; color: var(--muted); }
.cal { display: grid; place-items: center; align-self: start; background: var(--blue-soft); color: var(--blue-ink); border-radius: 14px; padding: 6px 0; font-variant-numeric: tabular-nums; }
.cal b { font-size: 22px; line-height: 1.1; font-weight: 800; }
.cal i { font-style: normal; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.cal.past { background: var(--surface-2); color: var(--muted); }
.cal.past b { font-size: 15px; }
.kv { display: grid; grid-template-columns: 74px 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--blue-soft); color: var(--blue-ink); }
.chip.sand { background: var(--chip-sand); color: var(--chip-sand-ink); }
.tbd { color: var(--chip-sand-ink); background: var(--chip-sand); padding: 1px 7px; border-radius: 6px; font-weight: 600; }
.btn {
  justify-self: start; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 0; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--surface); background: var(--navy); padding: 9px 13px; border-radius: 10px;
}
.btn svg { width: 16px; height: 16px; }
.btn.light { background: var(--blue-soft); color: var(--blue-ink); }

/* Barra de pestañas */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px; border-radius: 12px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 700; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--blue-ink); background: var(--blue-soft); }

/* Hoja de detalle */
.scrim { position: fixed; inset: 0; background: rgba(15,22,38,.45); z-index: 30; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 560px; margin: 0 auto;
  background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,.18);
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  max-height: 88vh; overflow-y: auto;
}
.sheet.open { transform: translateY(0); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet .top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sheet h2 { margin: 4px 0 6px; font-size: 22px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.sheet .close { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.sheet .close svg { width: 18px; height: 18px; }
.sheet .facts { display: grid; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.sheet .fact svg { color: var(--blue); }
.sheet .fact small { color: var(--muted); }
.sheet .sub { margin: 0; color: var(--muted); }
.maps { display: inline-block; margin-top: 4px; font-size: 13px; font-weight: 700; }
.sub-opts { display: grid; gap: 10px; margin-top: 18px; }
.sub-opts .btn { justify-self: stretch; justify-content: center; padding: 13px; font-size: 14px; }
.sub-note { margin: 14px 0 0; font-size: 12px; color: var(--muted); }

.empty { text-align: center; padding: 32px 16px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .scrim, .sheet, .dot { transition: none; }
}
</style>

</head>

    { "fecha": "curso", "etiqueta": "Curso 2025/2026", "temas": [8], "titulo": "Abordar y resolver los conflictos", "sub": "De «felices para siempre» a resolver juntos", "libro": "Tema 8 · pp. 167–184", "pdf": null }
  ]
}
</script>

<script>
(function () {
  const D = JSON.parse(document.getElementById("datos").textContent);
  const HORA = D.hora;
  const REPO = "https://github.com/pablorenedolastra/catequesis-novios/blob/main/catequesis/";

  // ---------- Utilidades ----------
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const DAY = 86400000;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const fmt = (d, o) => new Intl.DateTimeFormat("es-ES", o).format(d);
  const weekday = d => cap(fmt(d, { weekday: "long" }));
  const dayMonth = d => fmt(d, { day: "numeric", month: "long" });
  const shortMonth = d => fmt(d, { month: "short" }).replace(".", "");
  const monthYear = d => cap(fmt(d, { month: "long", year: "numeric" }));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mapsUrl = c => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c.q);
  const temaLabel = t => t.length > 1 ? "Temas " + t.join(" y ") : "Tema " + t[0];
  const weeks = (a, b) => Math.round((b - a) / (7 * DAY));

  const ICON = {
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M15 15l-3 3-3-3M12 12v6"/></svg>',
    calPlus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8M16 2v4M8 2v4M3 10h18M19 16v6M16 19h6"/></svg>'
  };

  // ---------- Estado ----------
  let carIdx = 0;
  let mcMonth = null;

  function plan() {
    return D.plan.map((x, i) => Object.assign({}, D.sesiones[x.s], {
      id: "s" + i, n: i + 1, date: parse(x.f),
      casa: D.casas[x.casa], prepara: D.parejas[x.prepara]
    }));
  }
  const upcoming = () => plan().filter(s => s.date >= today());

  function countdown(d) {
    const n = Math.round((d - today()) / DAY);
    if (n === 0) return "Hoy";
    if (n === 1) return "Mañana";
    if (n <= 31) return "Dentro de " + n + " días";
    return "Dentro de " + Math.round(n / 7) + " semanas";
  }

  // ---------- Vista: Catequesis ----------
  function slide(s, i) {
    return `
      <button class="hero${i ? " later" : ""}" type="button" data-open="${s.id}" aria-label="${weekday(s.date)} ${dayMonth(s.date)}, ver detalle">
        <span class="tags">${i === 0 ? '<span class="tag first">Próxima</span>' : ""}<span class="tag">${countdown(s.date)}</span></span>
        <span>
          <span class="weekday">${weekday(s.date)}</span>
          <span class="date">${dayMonth(s.date)}</span>
        </span>
        <span class="facts">
          <span class="fact">${ICON.clock}<span><strong>${HORA} h</strong></span></span>
          <span class="fact">${ICON.pin}<span><strong>${esc(s.casa.nombre)}</strong><small>${esc(s.casa.dir)}</small></span></span>
        </span>
        <span class="more">Ver tema y quién la prepara ${ICON.right}</span>
      </button>`;
  }

  function renderHome() {
    const el = document.getElementById("view-catequesis");
    const list = upcoming();
    let html = `
      <header class="masthead">
        <div class="parish">Parroquia Reina del Cielo</div>
        <h1 id="t-home">Catequesis <span>De la mano</span> para Novios</h1>
        <div class="course">Curso 2026/2027 · Jueves a las ${HORA}</div>
        <div class="pills">
          <button class="pill blue" type="button" data-subscribe>${ICON.calPlus} Añadir a mi calendario</button>
        </div>
      </header>`;
    if (!list.length) {
      el.innerHTML = html + `<p class="empty">No hay más catequesis programadas este curso.</p>`;
      return;
    }
    carIdx = Math.min(carIdx, list.length - 1);
    html += `
      <div>
        <p class="section-label">${list.length > 1 ? "Próximas catequesis" : "Próxima catequesis"}</p>
        <div class="track" id="track" tabindex="-1">${list.map(slide).join("")}</div>
        ${list.length > 1 ? `
        <div class="car-nav">
          <button class="arrow" type="button" data-car="-1" aria-label="Anterior">${ICON.left}</button>
          <div class="dots">${list.map((s, i) => `<button class="dot" type="button" data-dot="${i}" aria-label="${dayMonth(s.date)}"></button>`).join("")}</div>
          <button class="arrow" type="button" data-car="1" aria-label="Siguiente">${ICON.right}</button>
        </div>
        <div class="car-pos" id="car-pos" aria-live="polite"></div>` : ""}
      </div>`;
    el.innerHTML = html;
    const track = document.getElementById("track");
    track.addEventListener("scroll", () => {
      const w = track.clientWidth + 12;
      const i = Math.round(track.scrollLeft / w);
      if (i !== carIdx) { carIdx = i; syncCar(); }
    }, { passive: true });
    if (carIdx) track.scrollLeft = carIdx * (track.clientWidth + 12);
    syncCar();
  }

  function syncCar() {
    const n = upcoming().length;
    document.querySelectorAll("[data-dot]").forEach(d => d.setAttribute("aria-current", +d.dataset.dot === carIdx ? "true" : "false"));
    const prev = document.querySelector('[data-car="-1"]'), next = document.querySelector('[data-car="1"]');
    if (prev) prev.disabled = carIdx <= 0;
    if (next) next.disabled = carIdx >= n - 1;
    const pos = document.getElementById("car-pos");
    if (pos) pos.textContent = (carIdx + 1) + " de " + n;
  }

  function goCar(i) {
    const track = document.getElementById("track");
    if (!track) return;
    const n = track.children.length;
    i = Math.max(0, Math.min(n - 1, i));
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    track.scrollTo({ left: i * (track.clientWidth + 12), behavior: reduce ? "auto" : "smooth" });
    carIdx = i; syncCar();
  }

  // ---------- Vista: Programa ----------
  function themeStatus() {
    const st = {};
    D.realizadas.forEach(r => r.temas.forEach(t => st[t] = { cls: "done", txt: "Hecho" }));
    plan().forEach(s => s.temas.forEach(t => {
      if (st[t] && st[t].cls === "done") return;
      const d = s.date.getDate() + " " + shortMonth(s.date);
      st[t] = st[t] ? { cls: "planned", txt: st[t].txt + " y " + d } : { cls: "planned", txt: d };
    }));
    return st;
  }

  function gapText(list, i) {
    if (i === 0) return "Primera sesión";
    return weeks(list[i - 1].date, list[i].date) + " semanas después";
  }

  function miniCal(list) {
    const first = new Date(list[0].date.getFullYear(), list[0].date.getMonth(), 1);
    const last = new Date(list[list.length - 1].date.getFullYear(), list[list.length - 1].date.getMonth(), 1);
    if (!mcMonth || mcMonth < first || mcMonth > last) {
      const nx = upcoming()[0];
      mcMonth = new Date((nx || list[0]).date.getFullYear(), (nx || list[0]).date.getMonth(), 1);
    }
    const y = mcMonth.getFullYear(), m = mcMonth.getMonth();
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    const byDay = {};
    list.forEach((s, i) => { if (s.date.getFullYear() === y && s.date.getMonth() === m) byDay[s.date.getDate()] = i; });
    const t = today();
    let cells = ["L", "M", "X", "J", "V", "S", "D"].map((w, i) => `<span class="wd${i === 3 ? " thu" : ""}">${w}</span>`).join("");
    for (let i = 0; i < lead; i++) cells += "<span></span>";
    for (let d = 1; d <= days; d++) {
      const dt = new Date(y, m, d);
      const cls = "d" + (dt.getDay() === 4 ? " thu" : "") + (+dt === +t ? " today" : "");
      cells += d in byDay
        ? `<button class="${cls} on" type="button" data-open="${list[byDay[d]].id}" aria-label="${dayMonth(dt)}: ${esc(list[byDay[d]].titulo)}">${d}</button>`
        : `<span class="${cls}">${d}</span>`;
    }
    const inMonth = Object.keys(byDay).map(Number).sort((a, b) => a - b);
    const items = inMonth.map(d => {
      const i = byDay[d], s = list[i];
      return `<li><b>Jue ${d}</b><div>${esc(s.titulo)}<br><span>${temaLabel(s.temas)} · </span><em>${gapText(list, i)}</em></div></li>`;
    }).join("");
    return `
      <div class="panel" aria-label="Calendario mensual">
        <div class="mc-head">
          <button class="arrow" type="button" data-mc="-1" aria-label="Mes anterior" ${mcMonth <= first ? "disabled" : ""}>${ICON.left}</button>
          <h3>${monthYear(mcMonth)}</h3>
          <button class="arrow" type="button" data-mc="1" aria-label="Mes siguiente" ${mcMonth >= last ? "disabled" : ""}>${ICON.right}</button>
        </div>
        <div class="mc-grid">${cells}</div>
        ${items ? `<ul class="mc-list">${items}</ul>` : `<p class="mc-empty">Sin catequesis este mes.</p>`}
      </div>`;
  }

  function sessionCard(s, i, list) {
    return `
      <article class="card">
        <span class="cal"><b>${s.date.getDate()}</b><i>${shortMonth(s.date)}</i></span>
        <div class="body">
          <div class="eyebrow">Sesión ${s.n} · ${temaLabel(s.temas)}</div>
          <h3>${esc(s.titulo)}</h3>
          <p class="sub">${esc(s.sub)}</p>
          <dl class="kv">
            <dt>Fecha</dt><dd>${weekday(s.date)}, ${dayMonth(s.date)} · ${HORA}</dd>
            <dt>Ritmo</dt><dd>${gapText(list, i)}</dd>
            <dt>Casa</dt><dd>${esc(s.casa.nombre)}</dd>
            <dt>Prepara</dt><dd>${esc(s.prepara)}</dd>
            <dt>Libro</dt><dd>${esc(s.libro)}</dd>
            <dt>Material</dt><dd><span class="tbd">Por preparar</span></dd>
          </dl>
        </div>
      </article>`;
  }

  function doneCard(r) {
    const full = r.fecha && r.fecha.length === 10 ? parse(r.fecha) : null;
    const month = r.fecha && r.fecha.length === 7 ? parse(r.fecha) : null;
    const cal = full ? `<span class="cal past"><b>${full.getDate()}</b><i>${shortMonth(full)}</i></span>`
      : month ? `<span class="cal past"><b>${shortMonth(month)}</b><i>${r.fecha.slice(0, 4)}</i></span>`
      : r.fecha === "curso" ? `<span class="cal past"><b>25/26</b><i>curso</i></span>`
      : `<span class="cal past"><b>?</b><i>fecha</i></span>`;
    const fecha = full ? `${weekday(full)}, ${dayMonth(full)} de ${full.getFullYear()}` : r.fecha ? esc(r.etiqueta) : `<span class="tbd">${esc(r.etiqueta)}</span>`;
    return `
      <article class="card done">
        ${cal}
        <div class="body">
          <div class="eyebrow">${temaLabel(r.temas)} · ${r.temas.map(t => esc(D.temas[t])).join(" y ")}</div>
          <h3>${esc(r.titulo)}</h3>
          <p class="sub">${esc(r.sub)}</p>
          <dl class="kv">
            <dt>Fecha</dt><dd>${fecha}</dd>
            <dt>Prepara</dt><dd><span class="tbd">Por añadir</span></dd>
            <dt>Libro</dt><dd>${esc(r.libro)}</dd>
          </dl>
          ${r.pdf
            ? `<a class="btn" href="${REPO + r.pdf}" target="_blank" rel="noopener">${ICON.file} Abrir PDF</a>`
            : `<div class="chips"><span class="chip sand">PDF por subir</span></div>`}
        </div>
      </article>`;
  }

  function renderProgram() {
    const el = document.getElementById("view-programa");
    const list = plan();
    const st = themeStatus();
    const first = list[0].date, last = list[list.length - 1].date;
    el.innerHTML = `
      <header class="page-head">
        <h1 id="t-prog">Programa</h1>
        <p>${list.length} sesiones, del ${dayMonth(first)} al ${dayMonth(last)}, alternando 3 y 4 semanas</p>
      </header>

      ${miniCal(list)}

      <div>
        <p class="section-label">Sesiones previstas</p>
        <div class="plan">${list.map((s, i) => sessionCard(s, i, list)).join("")}</div>
      </div>

      <div class="panel">
        <p class="section-label" style="margin:0">Temario de Juntos en Camino</p>
        <div class="themes">
          ${Object.keys(D.temas).map(n => {
            const s = st[n] || { cls: "", txt: "Sin fecha" };
            return `<div class="theme ${s.cls}"><span class="n">${n}</span><div><strong>${esc(D.temas[n])}</strong><small>${esc(s.txt)}</small></div></div>`;
          }).join("")}
        </div>
        <div class="legend">
          <span><i style="background:var(--navy)"></i>Hecho</span>
          <span><i style="background:var(--blue-soft);border:1px solid var(--blue)"></i>Programado</span>
        </div>
      </div>

      <div>
        <p class="section-label">Ya realizadas</p>
        <div class="plan">${D.realizadas.map(doneCard).join("")}</div>
      </div>`;
  }

  // ---------- Hoja de detalle ----------
  const sheet = document.getElementById("sheet");
  const scrim = document.getElementById("scrim");
  let lastFocus = null;

  function present(html) {
    lastFocus = document.activeElement;
    sheet.innerHTML = `<div class="grab"></div>` + html;
    scrim.hidden = false; sheet.hidden = false;
    requestAnimationFrame(() => { scrim.classList.add("open"); sheet.classList.add("open"); sheet.querySelector(".close").focus(); });
  }

  function openSheet(id) {
    const s = plan().find(x => x.id === id);
    if (!s) return;
    present(`
      <div class="top">
        <div>
          <div class="section-label" style="margin:0;color:var(--blue)">${temaLabel(s.temas)} · Juntos en Camino</div>
          <h2 id="sheet-title">${esc(s.titulo)}</h2>
          <p class="sub">${esc(s.sub)}</p>
        </div>
        <button class="close" type="button" data-close aria-label="Cerrar">${ICON.x}</button>
      </div>
      <div class="facts">
        <div class="fact">${ICON.users}<div><small>Prepara</small><strong>${esc(s.prepara)}</strong></div></div>
        <div class="fact">${ICON.clock}<div><small>Cuándo</small><strong>${weekday(s.date)}, ${dayMonth(s.date)} · ${HORA}</strong></div></div>
        <div class="fact">${ICON.pin}<div><small>Dónde</small><strong>${esc(s.casa.nombre)}</strong><span>${esc(s.casa.dir)}</span><br><a class="maps" href="${mapsUrl(s.casa)}" target="_blank" rel="noopener">Cómo llegar</a></div></div>
        <div class="fact">${ICON.book}<div><small>En el libro</small><strong>${esc(s.libro)}</strong></div></div>
      </div>`);
  }

  function openSubscribe() {
    const webcal = D.ics.replace(/^https?:/, "webcal:");
    const google = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(webcal);
    present(`
      <div class="top">
        <div>
          <div class="section-label" style="margin:0;color:var(--blue)">Calendario compartido</div>
          <h2 id="sheet-title">Añadir a mi calendario</h2>
          <p class="sub">Las catequesis aparecen en tu calendario y se actualizan solas si cambiamos una fecha o una casa.</p>
        </div>
        <button class="close" type="button" data-close aria-label="Cerrar">${ICON.x}</button>
      </div>
      <div class="sub-opts">
        <a class="btn" href="${google}" target="_blank" rel="noopener">Google Calendar</a>
        <a class="btn light" href="${webcal}">iPhone o Mac</a>
        <button class="btn light" type="button" data-copy="${esc(D.ics)}">Copiar enlace</button>
      </div>
      <p class="sub-note">En Android, añádelo una vez desde Google Calendar en el ordenador y aparecerá en el móvil.</p>`);
  }

  function closeSheet() {
    scrim.classList.remove("open"); sheet.classList.remove("open");
    setTimeout(() => { scrim.hidden = true; sheet.hidden = true; }, 280);
    if (lastFocus) lastFocus.focus();
  }

  // ---------- Navegación ----------
  function show() {
    if (!sheet.hidden) closeSheet();
    const v = location.hash === "#programa" ? "programa" : "catequesis";
    document.getElementById("view-catequesis").hidden = v !== "catequesis";
    document.getElementById("view-programa").hidden = v !== "programa";
    document.querySelectorAll(".tabbar a").forEach(a => { if (a.dataset.tab === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
    if (v === "catequesis") syncCar();
  }
  function renderAll() { renderHome(); renderProgram(); }

  document.addEventListener("click", e => {
    const o = e.target.closest("[data-open]");
    if (o) { openSheet(o.dataset.open); return; }
    if (e.target.closest("[data-close]") || e.target === scrim) { closeSheet(); return; }
    if (e.target.closest("[data-subscribe]")) { openSubscribe(); return; }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const done = () => { cp.textContent = "Enlace copiado"; };
      try { navigator.clipboard.writeText(cp.dataset.copy).then(done, () => { cp.textContent = cp.dataset.copy; }); }
      catch (err) { cp.textContent = cp.dataset.copy; }
      return;
    }
    const car = e.target.closest("[data-car]");
    if (car) { goCar(carIdx + Number(car.dataset.car)); return; }
    const dot = e.target.closest("[data-dot]");
    if (dot) { goCar(Number(dot.dataset.dot)); return; }
    const mc = e.target.closest("[data-mc]");
    if (mc) { mcMonth = new Date(mcMonth.getFullYear(), mcMonth.getMonth() + Number(mc.dataset.mc), 1); renderProgram(); return; }
    const go = e.target.closest("[data-go]");
    if (go) { location.hash = go.dataset.go; }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !sheet.hidden) { closeSheet(); return; }
    if (!sheet.hidden || document.getElementById("view-catequesis").hidden) return;
    if (e.key === "ArrowRight") goCar(carIdx + 1);
    if (e.key === "ArrowLeft") goCar(carIdx - 1);
  });
  window.addEventListener("hashchange", show);

  renderAll();
  show();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>

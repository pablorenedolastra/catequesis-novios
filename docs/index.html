<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catequesis de novios</title>
<meta name="description" content="Materiales de la catequesis mensual de novios.">
<style>
  :root {
    --bg: #fbfaf7;
    --ink: #2a2723;
    --muted: #6f6a62;
    --line: #e4e0d8;
    --accent: #7a5c3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b19; --ink: #ece8e1; --muted: #a39d93; --line: #34312d; --accent: #d1b18a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px 72px; }
  .eyebrow { font: 600 12px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 40px; font-weight: normal; }
  ol { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { padding: 18px 0; border-bottom: 1px solid var(--line); }
  li a { color: var(--ink); text-decoration: none; font-size: 20px; }
  li a:hover { color: var(--accent); }
  .meta { display: block; font: 14px/1.4 system-ui, sans-serif; color: var(--muted); margin-top: 4px; }
  footer { margin-top: 48px; font: 13px/1.4 system-ui, sans-serif; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Catequesis de novios</p>
  <h1>Materiales de las sesiones</h1>
  <ol>
    <li>
      <a href="https://github.com/pablorenedolastra/catequesis-novios/blob/main/catequesis/2026-11-empatia/empatia.pdf">Empatía: aprender a amar desde el otro</a>
      <span class="meta">Noviembre 2026 · Conocerse a uno mismo para poder amar al otro</span>
    </li>
    <li>
      <a href="https://github.com/pablorenedolastra/catequesis-novios/blob/main/catequesis/2026-05-vocacion-matrimonial/vocacion-matrimonial.pdf">Vocación matrimonial</a>
      <span class="meta">21 de mayo de 2026 · Iniciando un camino</span>
    </li>
  </ol>
  <footer>Parroquia · Grupo de novios</footer>
</main>
</body>
</html>
